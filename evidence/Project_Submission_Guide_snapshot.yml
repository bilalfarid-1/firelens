          - generic [ref=e304]:
            - heading "Submitting Your Project" [level=2] [ref=e306]
            - generic [ref=e308]:
              - generic [ref=e312]:
                - paragraph [ref=e313]: "In order for a project to be evaluated by our judges, teams must meet the following requirements:"
                - list [ref=e314]:
                  - listitem [ref=e315]: All team members must be confirmed participants at the same Local Event in order for your team’s project to be eligible for awards. If you are waitlisted for a Local Event, please reach out to the Local Lead to request acceptance to the event. If the Local Lead declines or does not respond, each member of the team should switch to another Local Event that has room for all participants.
                  - listitem [ref=e316]: All required fields in the project form must be completed.
                  - listitem [ref=e317]: All content in the project form must be in English.
                  - listitem [ref=e318]: You must click the “Submit for Judging” button prior to Sunday, November 15 at 11:59 p.m. local time of your Local Event. If your team is registered for the Universal Event, you must click the “Submit for Judging” button prior to Sunday, November 15 at 11:59 p.m. in accordance with the local time of your Team Owner's area of residence. Any projects saved or submitted past this deadline will not be eligible for judging.
                  - listitem [ref=e319]:
                    - text: Project demonstrations and final projects may not include any images, video, audio, or other likeness to persons under 18 years old per the
                    - link "NASA Space Apps Terms & Conditions" [ref=e320] [cursor=pointer]:
                      - /url: https://www.spaceappschallenge.org/legal/
                    - text: .
                - paragraph [ref=e321]: "Once you’re ready to submit your project, follow these steps on the Project Submission page:"
                - list [ref=e322]:
                  - listitem [ref=e323]: Check the box to agree to the "Terms and Conditions"
                  - listitem [ref=e324]: Check the box to agree to "Confirm All Work is Original"
                  - listitem [ref=e325]: Select “Submit for Judging.” If you have not completed all of the required sections on the Project page, you will not be able to submit.
                  - listitem [ref=e326]: If your project was submitted successfully, a banner will appear at the top of your screen along with a confirmation message. You may edit and resubmit your project as many times as you'd like until the end of the hackathon. Only your last saved submission will be reviewed by the judges.
