          - generic [ref=e332]:
            - heading "Accessing Your Participant Certificate" [level=2] [ref=e334]
            - generic [ref=e336]:
              - generic [ref=e340]:
                - paragraph [ref=e341]: Participants who submit a project to the 2026 NASA Space Apps Challenge will receive a participant certificate. Certificates will automatically become available for download on your user Profile once your project is submitted. Please note that your team must click the “Submit for Judging” button prior to Sunday, November 15 at 11:59pm local time of your Local Event in order to earn a certificate.
                - paragraph [ref=e342]: "To access your certificate:"
                - list [ref=e343]:
                  - listitem [ref=e344]: Once logged in, click your profile icon and select “Profile” in the drop down.
                  - listitem [ref=e345]: Go to "Participant Information" and look for “2026 NASA Space Apps Challenge.”
                  - listitem [ref=e346]: Click on the yellow “Download Participant Certificate” button to download. When downloading your certificate, make sure the selected paper size is “Letter” (8.5x11in / 215x297mm). Please note that the only downloadable format is a PDF version; we can not accommodate other versions.
                  - listitem [ref=e347]: We suggest downloading your participant certificate from a laptop or desktop, rather than a mobile device, to ensure proper formatting.
                  - listitem [ref=e348]:
                    - text: If you experience technical issues while downloading your participant certificate, please email
                    - link "web@spaceappschallenge.org" [ref=e349] [cursor=pointer]:
                      - /url: mailto:web@spaceappschallenge.org
                    - text: and include your username and team name. As a reminder, certificates are only available for participants who submit a project.
                - paragraph [ref=e350]:
                  - text: Note that your name will appear on the certificate based on what you have listed under Full Name in your Profile. For your “Full Name," please provide your first and last name as you would like it to appear on your Participant Certificate. If you would like to modify your full name, you can do this by clicking on the “Change” button next to “Full Name” in the “Account Information” section in your Profile. You can change this at any time, even after submitting a project. In inputting your name, please adhere to the
                  - link "NASA Space Apps Values" [ref=e351] [cursor=pointer]:
                    - /url: https://www.spaceappschallenge.org/about/
                  - text: .
